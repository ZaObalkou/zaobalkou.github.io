<style>
:root{--bg:#F2E8D5;--bg-rgb:242,232,213;--ink:#2A2118;--ink-rgb:42,33,24;--card:#FBF4E6;--accent:#8A3324;--accent-rgb:138,51,36;--muted:#5E5142;--faint:#8A7B66;--faint2:#A8997F;--desc:#3A3025;--onaccent:#F7EFDF;--gold:#B0853B;--notice:#6b5a3a}
body.dark{--bg:#15120E;--bg-rgb:21,18,14;--ink:#ECE3CF;--ink-rgb:236,227,207;--card:#221C15;--accent:#E08763;--accent-rgb:224,135,99;--muted:#BCAE92;--faint:#9C8F75;--faint2:#82765C;--desc:#DBD2BF;--onaccent:#1A1611;--gold:#D8AE55;--notice:#C9B68F}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'EB Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
input{font-family:inherit}
button{font-family:inherit}
::selection{background:var(--accent);color:var(--onaccent)}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:rgba(var(--ink-rgb),.16);outline:none;margin:4px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);box-shadow:0 1px 4px rgba(var(--ink-rgb),.3)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.92) rotate(-2deg)}60%{transform:scale(1.02) rotate(.6deg)}100%{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.app-bg{min-height:100vh;background:var(--bg);background-image:radial-gradient(circle at 18% 12%,rgba(176,133,59,.07),transparent 45%),radial-gradient(circle at 82% 78%,rgba(var(--accent-rgb),.06),transparent 42%);position:relative;transition:background .3s}
.hdr{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);background:rgba(var(--bg-rgb),.82);border-bottom:1px solid rgba(var(--ink-rgb),.14)}
.hdr-in{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.logo{display:flex;flex:0 0 auto;align-items:center;gap:10px;min-height:44px;white-space:nowrap;background:none;border:none;cursor:pointer;padding:0;color:var(--ink)}
.logo .m{display:block;flex:none;width:36px;height:36px;color:var(--accent)}
.logo .t{font-family:'Newsreader',Georgia,serif;font-size:28px;line-height:1.05;letter-spacing:-.025em;font-weight:500}
.logo .t em{color:var(--accent);font-weight:400;transition:color .2s}
.logo:hover .t em{color:var(--ink)}
.hsearch-wrap{flex:1;min-width:200px;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid rgba(var(--ink-rgb),.2);border-radius:999px;padding:8px 16px;transition:border-color .25s,box-shadow .25s}
.hsearch-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.1)}
.hsearch-wrap input{flex:1;border:none;background:none;outline:none;font-size:16px;color:var(--ink);min-width:0}
nav{display:flex;align-items:center;gap:6px}
.nav-btn{background:none;border:none;cursor:pointer;font-family:'EB Garamond',serif;font-size:16.5px;color:var(--muted);padding:8px 12px;border-radius:8px;transition:color .2s,background .2s}
.nav-btn:hover{color:var(--ink);background:rgba(var(--ink-rgb),.06)}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;color:var(--muted)}
.icon-btn:hover{color:var(--ink);background:rgba(var(--ink-rgb),.06)}
.nav-lib{display:flex;align-items:center;gap:8px;padding:8px 14px}
.badge{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 6px;background:var(--accent);color:var(--onaccent);border-radius:999px;font-size:12.5px;font-family:'EB Garamond',serif}
main{max-width:1180px;margin:0 auto;padding:0 28px 90px}
.cover{position:relative;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(var(--ink-rgb),.2),inset 0 0 0 1px rgba(255,255,255,.07)}
.cover .frame{position:absolute;inset:7px;border:1px solid currentColor;opacity:.28;border-radius:3px;pointer-events:none}
.cover img.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;background:inherit}
.book-card{background:none;border:none;padding:0;cursor:pointer;text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:11px}
.book-card .cover{aspect-ratio:2/3;padding:20px 18px;transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s;animation:riseIn .5s ease both}
.book-card:hover .cover{transform:translateY(-9px) rotate(-1deg);box-shadow:0 22px 40px rgba(var(--ink-rgb),.32)}
.kicker{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.78}
.c-title{font-family:'Newsreader',serif;font-weight:500;font-size:clamp(20px,2.2vw,25px);line-height:1.12}
.c-rule{width:32px;height:2px;margin:13px 0 11px}
.c-author{font-size:14px;letter-spacing:.04em;opacity:.85;font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:34px 26px}
.sec-head{border-bottom:1px solid rgba(var(--ink-rgb),.16);padding-bottom:12px;margin-bottom:30px}
.sec-head h2{font-family:'Newsreader',serif;font-weight:500;font-size:27px;margin:0}
.tag-chip{background:var(--card);border:1px solid rgba(var(--ink-rgb),.18);border-radius:999px;padding:7px 16px;font-family:'EB Garamond',serif;font-size:15.5px;color:var(--muted);cursor:pointer;transition:all .22s}
.tag-chip:hover{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-2px)}
.tag-active{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--onaccent);border:none;border-radius:999px;padding:7px 8px 7px 16px;font-size:15.5px;cursor:pointer;transition:opacity .2s}
.tag-active:hover{opacity:.85}
.mood{display:flex;align-items:baseline;gap:8px;background:var(--card);border:1px solid rgba(var(--ink-rgb),.18);border-radius:10px;padding:11px 18px;font-family:'Newsreader',serif;font-size:18px;color:var(--ink);cursor:pointer;transition:all .22s}
.mood:hover{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-3px)}
.spinner{width:34px;height:34px;border:3px solid rgba(var(--ink-rgb),.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:14px 26px;border-radius:999px;font-size:16.5px;box-shadow:0 14px 34px rgba(var(--ink-rgb),.34);animation:toastIn .35s cubic-bezier(.2,.9,.3,1) both;display:flex;align-items:center;gap:11px}
.toast .ck{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#2A2118}
.lib-btn{display:flex;align-items:center;gap:8px;border-radius:10px;padding:11px 18px;font-family:'EB Garamond',serif;font-size:16px;cursor:pointer;transition:all .22s}
.lib-btn:hover{transform:translateY(-2px)}
.numin{border:1px solid rgba(var(--ink-rgb),.24);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:15px;color:var(--ink);outline:none;text-align:center}
.quote-card{max-width:620px;margin:30px auto 6px;padding:26px 30px;background:var(--card);border:1px solid rgba(var(--ink-rgb),.14);border-left:3px solid var(--accent);border-radius:12px;text-align:left;box-shadow:0 6px 20px rgba(var(--ink-rgb),.07);animation:fadeIn .6s ease both}
.quote-label{font-size:12.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.quote-text{font-family:'Newsreader',serif;font-style:italic;font-size:clamp(18px,2.4vw,22px);line-height:1.5;color:var(--ink);margin:0}
.quote-author{font-size:15px;color:var(--faint);margin-top:14px;font-style:normal}
.notice{background:var(--card);border:1px solid rgba(176,133,59,.4);border-left:3px solid var(--gold);border-radius:10px;padding:12px 16px;color:var(--notice);font-size:14.5px;margin:0 0 24px}
.desc{font-size:19px;line-height:1.72;color:var(--desc);margin:0 0 22px;max-width:62ch;white-space:pre-line}
.rcard{background:var(--card);border:1px solid rgba(var(--ink-rgb),.16);border-radius:12px;padding:17px 18px}
a{color:inherit}

/* ============ mobile ============ */
@media (max-width:640px){
main{padding:0 16px 70px}
.hdr-in{padding:10px 14px;gap:12px}
.hsearch-wrap{min-width:140px}
.grid{grid-template-columns:repeat(2,1fr);gap:14px 10px}
.book-card{gap:8px}
.book-card .cover{padding:12px 10px}
.book-card .kicker{font-size:9.5px}
.book-card .c-title{font-size:clamp(13px,3.8vw,17px)!important}
.c-author{font-size:11.5px}
.c-rule{margin:7px 0 6px;width:22px}
.book-card .cover .frame{inset:4px}
.sec-head h2{font-size:22px}
.detail-cover{width:140px!important;position:relative!important;top:auto!important;margin-bottom:0}
}
@media (max-width:420px){
.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px 8px}
}

/* Shared controls and narrow-screen fixes. */
:root{--faint:#74634E;--faint2:#78674F}
body.dark{--faint:#BCAE92;--faint2:#A99A80}
.book-meta{font-size:13px;color:var(--muted);line-height:1.45;margin-top:5px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
.toolbar [aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.filters{align-items:flex-end;padding:16px;background:var(--card);border:1px solid rgba(var(--ink-rgb),.15);border-radius:12px}
.filters label{display:flex;flex:1;min-width:150px;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
select{max-width:100%;width:100%;border:1px solid rgba(var(--ink-rgb),.24);background:var(--bg);color:var(--ink);padding:9px;border-radius:7px;font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--accent);outline-offset:4px}
.book-card{min-width:0;color:var(--ink)}
.book-card>.cover{width:100%}
.c-title,.desc,.book-card{overflow-wrap:anywhere}
.skip-link{position:fixed;top:-80px;left:12px;z-index:100;background:var(--card);padding:12px}
.skip-link:focus{top:12px}
.file-input{display:block;max-width:220px;font-size:13px;margin-top:5px}
.toast{max-width:calc(100vw - 24px);width:max-content;border-radius:14px}
@media(max-width:640px){
 .hdr-in>.hsearch-wrap{order:3;flex-basis:100%;max-width:none}
 .hdr-in{justify-content:space-between;gap:8px}
 .hdr-in nav{margin-left:auto;gap:0}.nav-btn{padding:8px}
 .logo .t{font-size:22px}.logo{gap:6px}.logo .m{width:28px;height:28px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
 #main div[style*="min-width:300px"],#main div[style*="min-width:240px"]{min-width:0!important;flex-basis:100%!important}
 .filters label{min-width:100%;width:100%}
 .detail-cover{width:180px!important;margin:auto!important}
 .quote-card{padding:18px 20px}
}
@media(max-width:420px){.hdr-in nav>.nav-btn[data-action="home"]{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function hashStr(s){ s=String(s||''); var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return Math.abs(h); }
function palette(seed){ return PALETTES[ hashStr(seed) % PALETTES.length ]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function decodeEntities(s){
  if(!s) return '';
  s=s.replace(/&#x([0-9a-fA-F]+);/g,function(_,h){return String.fromCharCode(parseInt(h,16));})
     .replace(/&#([0-9]+);/g,function(_,n){return String.fromCharCode(parseInt(n,10));});

}
function saveLib(){

  try { localStorage.setItem('mzr_lib_v2', JSON.stringify(state.lib)); state.storageError=''; return true; }
  catch(e){ state.storageError='Změny se nepodařilo uložit. Zálohuj knihovnu před zavřením stránky.'; return false; }
}
function exportLibrary(raw){
  // Keep the original backup format compatible with MeziŘádky imports.
  var value=raw ? localStorage.getItem('mzr_lib_v2') : JSON.stringify({format:'meziradky',version:1,exportedAt:new Date().toISOString(),library:state.lib},null,2);
  var blob=new Blob([value || '{}'],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');

function importLibrary(file){
  if(!file) return;
  if(file.size>5000000){flash('Záloha je příliš velká (maximum 5 MB).'); return;}
  file.text().then(function(text){
    var raw=JSON.parse(text);
    if(raw.format && (raw.format!=='meziradky' || raw.version!==1)) throw new Error('Nepodporovaná verze zálohy.');
    var incoming=Core.validateLibrary(raw.library || raw), merged=Object.assign(Object.create(null),state.lib);
    Object.keys(incoming).forEach(function(id){
      // Existing progress wins. Import only missing books, including alternate source IDs.
      if(!Object.keys(merged).some(function(k){return k===id || Core.sameBook(merged[k].book,incoming[id].book);})) merged[id]=incoming[id];
    });
    merged=Core.validateLibrary(merged);
    if(state.storageBlocked){
      // Preserve corrupt original bytes before a successful recovery can replace them.
      localStorage.setItem('mzr_lib_recovery_'+Date.now(),localStorage.getItem('mzr_lib_v2') || '');
    }
    localStorage.setItem('mzr_lib_v2',JSON.stringify(merged));
    state.lib=merged; state.storageBlocked=false; state.storageError=''; updateBadge(); renderMain(); flash('Záloha načtena. Stávající pokrok zůstal zachován.');
  }).catch(function(e){flash('Import se nezdařil: '+e.message);});
}

    +'</div>'+progress+removeBtn+'</div>'
    +'<div style="font-family:\'Newsreader\',serif;font-size:20px;margin-bottom:16px">Hodnocení čtenářů</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px">'+ratings+'</div><p class="book-meta">'+(Core.rating(b)&&Core.rating(b).source==='Goodreads'?'Přednostně Goodreads.':'Goodreads nemáme pro toto vydání ověřené; zobrazujeme dostupné zdroje.')+'</p><a class="book-meta" href="https://www.goodreads.com/search?q='+encodeURIComponent((b.isbn||b.title+' '+b.author))+'" target="_blank" rel="noopener">Najít na Goodreads ↗</a>'
    +'</div></div></div>';
  return h;
}

/* ============ LIBRARY ============ */
function shelf(status){
  var out=[];
  for(var id in state.lib){ if(state.lib[id].status===status){ var e=state.lib[id]; out.push(Object.assign({},e.book,{page:e.page||0,pages:e.pages==null?((e.book&&e.book.pages)||0):e.pages})); } }
  return out;
}
function libraryHTML(){
  var reading=shelf('reading'), want=shelf('want'), read=shelf('read');
  var count=Object.keys(state.lib).length;
  var h='<div style="animation:fadeIn .4s ease both;padding-top:44px">'
    +'<h1 style="font-family:\'Newsreader\',serif;font-weight:400;font-size:clamp(34px,5vw,50px);margin:0 0 6px">Moje knihovna</h1>'
    +'<p style="color:var(--faint);font-size:17px;margin:0 0 38px">'+count+' '+plkn(count)+' na tvých poličkách</p>'+backupHTML();
  if(count===0){
    h+='<div style="text-align:center;padding:64px 20px;background:var(--card);border:1px dashed rgba(var(--ink-rgb),.22);border-radius:16px">'
      +'<div style="font-family:\'Newsreader\',serif;font-size:28px;font-style:italic;margin-bottom:10px">Tvoje poličky jsou zatím prázdné.</div>'
      +'<p style="font-size:17px;color:var(--faint);margin:0 0 22px">Najdi si knihu a přidej ji do knihovny.</p>'
      +'<button data-action="home" style="background:var(--accent);color:var(--onaccent);border:none;border-radius:10px;padding:12px 26px;font-size:17px;cursor:pointer">Objevovat knihy</button></div></div>';
    return h;
  }
  if(reading.length){
    h+='<section style="margin-bottom:46px"><h2 style="font-family:\'Newsreader\',serif;font-weight:500;font-size:24px;margin:0 0 20px;display:flex;align-items:baseline;gap:11px">Rozečtené<span style="font-size:15px;color:var(--faint2)">'+reading.length+'</span></h2>'
      +'<div style="display:flex;flex-direction:column;gap:16px">'+reading.map(readingRowHTML).join('')+'</div></section>';
  }
  if(want.length){
    h+='<section style="margin-bottom:46px"><h2 style="font-family:\'Newsreader\',serif;font-weight:500;font-size:24px;margin:0 0 22px;display:flex;align-items:baseline;gap:11px">Chci přečíst<span style="font-size:15px;color:var(--faint2)">'+want.length+'</span></h2>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:30px 22px">'+want.map(wantCardHTML).join('')+'</div></section>';
  }
  if(read.length){
    h+='<section><h2 style="font-family:\'Newsreader\',serif;font-weight:500;font-size:24px;margin:0 0 22px;display:flex;align-items:baseline;gap:11px">Přečtené<span style="font-size:15px;color:var(--faint2)">'+read.length+'</span></h2>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:30px 22px">'+read.map(readCardHTML).join('')+'</div></section>';
  }
  h+='</div>';
  return h;
}
function readingRowHTML(b){
  var total=b.pages||0;
  var pct=total?Math.min(100,Math.round(b.page/total*100)):0;
  var slider = total ? '<input type="range" data-action="slider" data-id="'+attr(b.id)+'" min="0" max="'+total+'" value="'+b.page+'" style="flex-basis:100%;margin-top:6px">' : '';
  return '<div style="display:flex;gap:20px;align-items:center;background:var(--card);border:1px solid rgba(var(--ink-rgb),.14);border-radius:14px;padding:18px;flex-wrap:wrap">'
    +'<button data-action="open" data-id="'+attr(b.id)+'" style="flex:none;width:72px;height:108px;border:none;padding:0;cursor:pointer;border-radius:5px;overflow:hidden;background:none">'+coverHTML(b,{})+'</button>'
    +'<div style="flex:1;min-width:240px"><div style="font-family:\'Newsreader\',serif;font-size:21px;line-height:1.18;color:var(--ink)">'+esc(b.title)+'</div>'
    +'<div style="font-size:14.5px;color:var(--faint);margin-bottom:12px">'+esc(b.author)+'</div>'+bookMeta(b)
    +'<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px">'
    +'<span style="font-size:15px;color:var(--muted)">Strana</span>'
    +'<input type="number" class="numin" style="width:74px" data-action="page" data-id="'+attr(b.id)+'" data-pnum="'+attr(b.id)+'" value="'+b.page+'" min="0" max="'+(total||9999)+'">'
    +'<span style="font-size:15px;color:var(--muted)">z</span>'
    +'<input type="number" class="numin" style="width:74px" data-action="total" data-id="'+attr(b.id)+'" value="'+(total||'')+'" min="0" placeholder="stran">'
    + (total?'<span data-ppct="'+attr(b.id)+'" style="font-size:15px;color:var(--muted)">'+pct+' %</span>':'')
    +'<button data-action="status" data-id="'+attr(b.id)+'" data-status="read" style="margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--ink);color:var(--bg);border:none;border-radius:8px;padding:8px 15px;font-size:15px;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>Dočteno</button>'
    +'<button data-action="remove" data-id="'+attr(b.id)+'" style="background:none;border:none;cursor:pointer;color:var(--faint2);font-size:20px;line-height:1;padding:4px 8px">×</button>'
    + slider
    +'</div></div></div>';
}
function wantCardHTML(b){
  return '<div style="display:flex;flex-direction:column;gap:11px">'
    +'<button data-action="open" data-id="'+attr(b.id)+'" class="book-card">'+coverHTML(b,{})+'</button>'+titleBlock(b)
    +'<div style="display:flex;gap:8px">'
    +'<button data-action="status" data-id="'+attr(b.id)+'" data-status="reading" style="flex:1;background:var(--card);border:1px solid rgba(var(--ink-rgb),.2);border-radius:8px;padding:8px;font-size:14px;color:var(--muted);cursor:pointer">Začít číst</button>'
    +'<button data-action="remove" data-id="'+attr(b.id)+'" style="background:none;border:1px solid rgba(var(--ink-rgb),.2);border-radius:8px;cursor:pointer;color:var(--faint2);font-size:18px;line-height:1;padding:0 12px">×</button>'
    +'</div></div>';
}
function readCardHTML(b){
  var badge='<div style="position:absolute;top:12px;right:12px;z-index:3;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--accent)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"></polyline></svg></div>';
  return '<div style="display:flex;flex-direction:column;gap:11px">'
    +'<button data-action="open" data-id="'+attr(b.id)+'" class="book-card">'+coverHTML(b,{badge:badge})+'</button>'+titleBlock(b)
    +'<button data-action="remove" data-id="'+attr(b.id)+'" style="background:none;border:none;cursor:pointer;color:var(--faint2);font-size:14px;padding:0;text-align:left">Odebrat</button></div>';
}

/* ============ odkazy, přenos knihovny a Excel ============ */
var incomingTransfer=null,dialogSeq=0;
function setRoute(value){
  if(!window.history||!window.location)return;
  routeSeq++;
  var hash=value&&value.indexOf('https:')===0?new URL(value).hash:value;
  var next=window.location.pathname+window.location.search+(hash||'');
  if(window.location.hash!==(hash||''))window.history.pushState(null,'',next);
}
function dialogHTML(title,content){
  var d=el('readerDialog');
  d.innerHTML='<button class="dialog-close" data-action="closeDialog" aria-label="Zavřít">×</button><h2 id="dialogTitle">'+esc(title)+'</h2>'+content;
  if(!d.open)d.showModal();
}
function copyText(value){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(value).then(function(){flash('Odkaz zkopírován.');}).catch(function(){showCopy(value);});}
  else showCopy(value);
}
function showCopy(value){dialogHTML('Zkopíruj odkaz','<label for="copyUrl">Označ odkaz a zkopíruj ho.</label><textarea id="copyUrl" readonly rows="4">'+esc(value)+'</textarea>');el('copyUrl').select();}
function exportExcel(){
  try{
    var data=LibraryTools.exportXlsx(state.lib),url=URL.createObjectURL(new Blob([data],{type:LibraryTools.mimeType})),a=document.createElement('a');
    a.href=url;a.download='za-obalkou-knihovna.xlsx';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);flash('Tabulka knihovny je připravená.');
  }catch(e){flash('Tabulku se nepodařilo vytvořit: '+e.message);}
}
function showTransfer(){
  var seq=++dialogSeq;
  dialogHTML('Knihovna s tebou','<p role="status">Připravuji odkaz a QR kód…</p>');
  LibraryTools.transferLink(state.lib).then(function(r){
    if(seq!==dialogSeq||!el('readerDialog').open)return;
    dialogHTML('Knihovna s tebou','<p>Otevři odkaz na druhém zařízení nebo naskenuj QR kód. Přenese se <strong>'+r.count+' '+plkn(r.count)+'</strong> včetně pokroku a zvolených jazykových vydání.</p><p class="book-meta">Jde o aktuální snímek knihovny. Po dalším čtení vytvoř nový odkaz; změny se mezi zařízeními samy nesynchronizují.</p>'+(r.qrSvg?'<div class="transfer-qr" aria-label="QR kód pro přenos knihovny">'+r.qrSvg+'</div>':'<p class="book-meta">Knihovna je pro jeden QR kód příliš velká. Použij odkaz níže.</p>')+'<label for="transferUrl">Odkaz na tuto knihovnu</label><textarea id="transferUrl" readonly rows="3">'+esc(r.url)+'</textarea><div class="toolbar"><button class="tag-chip" data-action="copyTransfer">Kopírovat odkaz</button></div><p class="book-meta">Odkaz obsahuje tvoje knihy i pokrok. Sdílej ho jen s lidmi, kterým je chceš ukázat. Samotná knihovna se nikam neodesílá.</p>');
  }).catch(function(e){if(seq!==dialogSeq||!el('readerDialog').open)return;dialogHTML('Přenos knihovny','<p>'+esc(e.message)+'</p><button class="tag-chip" data-action="export">Stáhnout knihovnu jako soubor</button>');});
}
function previewTransfer(lib){
  dialogSeq++;
  incomingTransfer=lib;
  var entries=Object.values(lib);
  dialogHTML('Přidat přenesenou knihovnu','<p>Odkaz obsahuje <strong>'+entries.length+' '+plkn(entries.length)+'</strong>. Vyber, jak zacházet s knihami, které už máš uložené.</p><ul class="transfer-preview">'+entries.slice(0,12).map(function(e){return '<li>'+esc(e.book.title)+' · '+esc(languageName(e.book.language))+'</li>';}).join('')+(entries.length>12?'<li>A dalších '+(entries.length-12)+'…</li>':'')+'</ul><label for="transferConflict">Existující knihy</label><select id="transferConflict"><option value="keep">Ponechat můj současný pokrok</option><option value="incoming">Použít pokrok z odkazu</option></select><div class="toolbar"><button class="tag-chip" data-action="applyTransfer">Přidat do mojí knihovny</button><button class="tag-chip" data-action="closeDialog">Zrušit</button></div>');
}
function applyTransfer(){
  if(!incomingTransfer)return;
  if(state.storageBlocked){flash('Nejprve obnov původní data knihovny.');return;}
  var merged=Object.assign(Object.create(null),state.lib),replace=el('transferConflict').value==='incoming';
  Object.keys(incomingTransfer).forEach(function(id){
    var entry=incomingTransfer[id],existing=Object.keys(merged).find(function(k){return k===id||Core.sameBook(merged[k].book,entry.book);});
    if(!existing)merged[id]=entry;
    else if(replace)merged[existing]=Object.assign({},entry,{book:Core.snapshot(Object.assign({},entry.book,{id:existing}))});
  });
  try{merged=Core.validateLibrary(merged);localStorage.setItem('mzr_lib_v2',JSON.stringify(merged));state.lib=merged;incomingTransfer=null;el('readerDialog').close();updateBadge();goLibrary();flash('Knihovna přenesena.');}
  catch(e){flash('Přenos se nepodařilo uložit. Tvoje knihovna zůstala zachována.');}
}
var routeSeq=0;
function routeFromHash(){
  if(!window.location)return;
  var hash=window.location.hash,seq=++routeSeq;
  try{
    if(hash.indexOf('#book=')===0){var b=LibraryTools.parseBookFragment(hash);if(b){state.rawResults=Core.merge([state.rawResults,[b]]);openBook(b.id,true);}return;}
    if(hash.indexOf('#library=')===0){LibraryTools.parseLibraryFragment(hash).then(function(lib){if(seq===routeSeq&&lib)previewTransfer(lib);}).catch(function(e){dialogHTML('Odkaz nejde načíst','<p>'+esc(e.message)+'</p>');});return;}
    if(hash==='#shelf'){goLibrary();return;}
    if(!hash){cancelSearch();state.view='home';detailSeq++;renderMain();}
  }catch(e){dialogHTML('Odkaz nejde načíst','<p>'+esc(e.message)+'</p>');}
}

/* ============ render ============ */
function renderMain(){
  var focused=document.activeElement, heroFocused=focused && focused.id==='herosearch', caret=heroFocused?focused.selectionStart:null;
  var inputFocus=focused&&focused.matches&&focused.matches('[data-action=page],[data-action=total]')?{action:focused.dataset.action,id:focused.dataset.id}:null;
  var html;
  if(state.view==='search') html=searchHTML();
  else if(state.view==='detail') html=detailHTML();
  else if(state.view==='library') html=libraryHTML();
  else html=homeHTML();
  el('main').innerHTML=(state.storageError?'<div class="notice" role="alert">'+esc(state.storageError)+' <button class="tag-chip" data-action="exportRaw">Stáhnout původní data</button> <button class="tag-chip" data-action="export">Záloha aktuální knihovny</button></div>':'')+html;
  if(inputFocus){var target=document.querySelector('[data-action="'+inputFocus.action+'"][data-id="'+CSS.escape(inputFocus.id)+'"]');if(target)target.focus();}
  document.querySelectorAll('[data-action="page"]').forEach(function(x){x.setAttribute('aria-label','Aktuální strana');});
  document.querySelectorAll('[data-action="total"]').forEach(function(x){x.setAttribute('aria-label','Celkový počet stran');});
  document.querySelectorAll('[data-action="slider"]').forEach(function(x){x.setAttribute('aria-label','Pokrok čtení');});
  document.querySelectorAll('[data-action="remove"]').forEach(function(x){x.setAttribute('aria-label','Odebrat z knihovny');});
  if(heroFocused && state.view==='home' && el('herosearch')){el('herosearch').focus();try{el('herosearch').setSelectionRange(caret,caret);}catch(e){}}
  if(state._focusHeader){ var hs=el('hsearch'); if(hs){ hs.focus(); try{ hs.setSelectionRange(hs.value.length,hs.value.length); }catch(e){} } state._focusHeader=false; }
}
function updateBadge(){ var c=Object.keys(state.lib).length; el('libBadge').innerHTML = c>0 ? '<span class="badge">'+c+'</span>' : ''; }
function renderToast(){
  el('toastHost').innerHTML = state.toast
    ? '<div class="toast"><span class="ck"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"></polyline></svg></span>'+esc(state.toast)+(lastRemoved?'<button class="tag-chip" data-action="undo">Vrátit</button>':'')+'</div>'
    : '';
}

/* ============ události ============ */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-action]'); if(!t) return;
  var a=t.getAttribute('data-action');
  if(a==='slider'||a==='page'||a==='total') return;
  if(a==='home') goHome();
  else if(a==='theme') toggleTheme();
  else if(a==='back'){setRoute(state.returnView==='library'?'#shelf':'');detailSeq++;state.view=state.returnView==='library'?'library':(state.activeTags.length||state.query?'search':'home');if(state.view==='search'&&!state.rawResults.length)runSearch();else renderMain();}
  else if(a==='library') goLibrary();
  else if(a==='open') openBook(t.getAttribute('data-id'));
  else if(a==='mood') searchTag(MOODS[parseInt(t.getAttribute('data-mood'),10)]);
  else if(a==='tag-raw') searchRaw(t.getAttribute('data-term'), t.getAttribute('data-label'));
  else if(a==='removeTag') removeTag(parseInt(t.getAttribute('data-i'),10));
  else if(a==='clearTag') clearTag();
  else if(a==='more')loadMore();
  else if(a==='retry')runSearch();
  else if(a==='resetFilters'){state.filters={year:'all',language:'all',sort:'smart'};runSearch();}
  else if(a==='discover'){state.discovery=t.getAttribute('data-mode');refreshFeatured();}
  else if(a==='refreshFeatured')refreshFeatured(true);
  else if(a==='export')exportLibrary(false);
  else if(a==='excel')exportExcel();
  else if(a==='transfer')showTransfer();
  else if(a==='closeDialog'){dialogSeq++;el('readerDialog').close();}
  else if(a==='copyTransfer')copyText(el('transferUrl').value);
  else if(a==='applyTransfer')applyTransfer();
  else if(a==='copyBook')copyText(LibraryTools.bookLink(state.detail));
  else if(a==='refreshDetail')openBook(state.detail.id);
  else if(a==='exportRaw')exportLibrary(true);
  else if(a==='undo')undoRemove();
  else if(a==='status') setStatus(t.getAttribute('data-id'),t.getAttribute('data-status'));
  else if(a==='remove') removeFromLib(t.getAttribute('data-id'));
});
document.addEventListener('input',function(e){
  var a=e.target.getAttribute&&e.target.getAttribute('data-action');
  if(e.target.id==='hsearch'){ state._fromHero=false; onQuery(e.target.value); }
  else if(e.target.id==='herosearch'){ state._fromHero=true; onQuery(e.target.value); }
  else if(a==='slider'){ sliderLive(e.target.getAttribute('data-id'), e.target.value); }
  else if(a==='page')setPage(e.target.getAttribute('data-id'),e.target.value,true);
  else if(a==='total')setTotal(e.target.getAttribute('data-id'),e.target.value,true);
});
document.addEventListener('change',function(e){
  var a=e.target.getAttribute&&e.target.getAttribute('data-action');
  if(e.target.id==='backupImport'){importLibrary(e.target.files[0]);e.target.value='';}
  else if(e.target.dataset.filter){state.filters[e.target.dataset.filter]=e.target.value;if(e.target.dataset.filter==='sort')applyFilters();else runSearch();}
  else if(a==='edition')openBook(e.target.value);
  else if(a==='page'){ setPage(e.target.getAttribute('data-id'), e.target.value); }
  else if(a==='total'){ setTotal(e.target.getAttribute('data-id'), e.target.value); }
  else if(a==='slider'){ renderMain(); }
});
document.addEventListener('keydown',function(e){
  if((e.target.id==='hsearch'||e.target.id==='herosearch') && e.key==='Enter'){ clearTimeout(searchTimer); state._fromHero=(e.target.id==='herosearch'); applyQuery(); }
});
window.addEventListener('storage',function(e){if(e.key==='mzr_lib_v2'){state.storageBlocked=false;state.storageError='';loadLib();updateBadge();renderMain();}});

/* ============ start ============ */
initTheme();
loadLib();
loadQuote();
updateBadge();
refreshFeatured();
routeFromHash();
window.addEventListener('hashchange',routeFromHash);


})();
</script>
</body>
</html>
